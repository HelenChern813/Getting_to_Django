{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="row mt-5 pt-5">
    <h1 class="text-center"> Главная </h1>
    <h6 class="text-center text-secondary"> Вы находитесь на сайте, предназнаенном для продажи товаров.  </h6>
</div>
<div>Список всех товаров</div>
<div>
            <ul class="list-group">
            {% for product in products %}
                <li class="list-group-item d-flex justify-content-between align-items-center {% if student.year == 'first' %}list-group-item-primary{% elif student.year == 'second' %}list-group-item-success{% elif student.year == 'third' %}list-group-item-warning{% elif student.year == 'fourth' %}list-group-item-danger{% endif %}">
                    {{ product |truncatechars:100}}

                </li>
            {% endfor %}
        </ul>
</div>

{% endblock %}
