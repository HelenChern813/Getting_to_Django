{% extends 'base.html' %}

{% block title %} Удаление публикации {{ blogs.title }} {% endblock %}

{% block content %}

<div class="container mt-5">
        <h1 class="mb-4">Удалить объект {{ blogs.title }}</h1>
        <p>Вы уверены, что хотите удалить "{{ blogs.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blogs:publication_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

{% endblock %}
